# Sibling checkout (default): ../OWL2VOWL
# CI / nested checkout: OWL2VOWL_CONTEXT=./OWL2VOWL

services:
  webvowl:
    build:
      context: .
      dockerfile: docker/Dockerfile
      additional_contexts:
        owl2vowl: ${OWL2VOWL_CONTEXT:-../OWL2VOWL}
    image: ${WEBVOWL_IMAGE:-webvowl:local}
    container_name: webvowl-local
    ports:
      - "${WEBVOWL_PORT:-8080}:8080"
    volumes:
      - ./data:/data
      # - ./deploy:/usr/local/tomcat/webapps/ROOT:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/serverTimeStamp"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    restart: unless-stopped
