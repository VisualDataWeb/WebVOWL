server {
    listen 80;
    server_name localhost;

    # Serve WebVOWL static files
    location / {
        root /var/www/webvowl;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy OWL2VOWL converter endpoints to Tomcat
    location /convert {
        proxy_pass http://localhost:8080/convert;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /serverTimeStamp {
        proxy_pass http://localhost:8080/serverTimeStamp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
